<html>
<head>
    <title>CSS Transitions, Transforms and Animations</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>CSS Effects Demo</h1>

    <section>
        <h2>1. CSS Transition</h2>
        <button class="transition-btn">Hover Over Me</button>
    </section>

    <section>
        <h2>2. CSS Transformations</h2>

        <div class="transform-container">
            <div class="box scale">Scale</div>
            <div class="box rotate">Rotate</div>
            <div class="box translate">Translate</div>
        </div>
    </section>

    <section>
        <h2>3. CSS Animation</h2>

        <div class="animation-area">
            <div class="animated-box">Moving Box</div>
        </div>
    </section>
</body>
</html>
